<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nkwkr.lol</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #060606;
            color: #d1d1d1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            min-height: 100vh;
            position: relative;
        }

        /* Ambient Glow & Background FX */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Logo at the top of the card/page */
        .page-logo-container {
            position: relative;
            z-index: 2;
            margin-bottom: 18px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            flex-shrink: 0;
        }

        .page-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 14px;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6));
        }

        /* Subtle Rainbow Orbit Border Container Wrapper */
        .card-wrapper {
            position: relative;
            z-index: 1;
            max-width: 620px;
            width: 100%;
            border-radius: 14px;
            padding: 2px; /* Subtle line thickness */
            background: #101010; /* Solid dark backing to prevent bleed-through */
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            opacity: 0;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
            flex-shrink: 0;
        }

        /* Outer container to cleanly mask the spinning conic gradient */
        .border-glow-mask {
            position: absolute;
            inset: -150%;
            animation: borderOrbit 6s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        .border-glow-mask::before {
            content: '';
            position: absolute;
            inset: 0;
            background: conic-gradient(
                from 0deg at 50% 50%,
                transparent 0deg,
                transparent 305deg,
                rgba(255, 51, 51, 0.5) 318deg,
                rgba(255, 153, 51, 0.7) 332deg,
                rgba(255, 255, 51, 0.8) 342deg,
                rgba(51, 255, 255, 0.8) 352deg,
                rgba(153, 51, 255, 0.7) 357deg,
                transparent 360deg
            );
        }

        @keyframes borderOrbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card {
            position: relative;
            background: #101010; /* Completely opaque solid card background */
            border-radius: 12px;
            padding: 32px 30px 24px 30px;
            text-align: left;
            width: 100%;
            z-index: 2;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Cleaner Header Layout for Title and Status Badge */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 14px;
            gap: 10px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #ff6666;
            white-space: nowrap;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background-color: #ff4d4d;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 77, 77, 0.8);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Typewriter Text Blocks */
        .typewriter-box {
            font-size: 13.5px;
            line-height: 1.7;
            color: #999;
            margin-bottom: 16px;
            min-height: auto; /* Allow auto height on mobile to prevent clipping */
        }

        .typewriter-text {
            padding-right: 3px;
        }

        .typewriter-text.active-caret {
            border-right: 2px solid rgba(255, 255, 255, 0.4);
            animation: caretBlink 0.8s infinite;
        }

        /* Separate Bold & Colorful Shoutout Box */
        .shoutout-box {
            font-size: 14.5px;
            font-weight: 800;
            min-height: auto;
            margin-bottom: 20px;
            letter-spacing: -0.2px;
        }

        .rainbow-shoutout {
            animation: rainbowFlash 4s linear infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            padding-right: 3px;
        }

        .rainbow-shoutout.active-caret {
            border-right: 2px solid rgba(255, 255, 255, 0.4);
            animation: rainbowFlash 4s linear infinite, caretBlink 0.8s infinite;
        }

        /* Contact Section Footer Styling */
        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: #777;
            gap: 10px;
            flex-wrap: wrap;
        }

        .contact-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .contact-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Modal Popup Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 30px 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            color: #fff;
            font-size: 19px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .modal-box p {
            color: #888;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
        }

        /* Clear, High-Visibility Email Box */
        .modal-email-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            text-decoration: none;
            transition: all 0.2s ease;
            gap: 10px;
        }

        .modal-email-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .modal-email-left {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-email-left i {
            color: #e0e0e0;
            font-size: 16px;
            flex-shrink: 0;
        }

        .modal-email-left span {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-email-action {
            font-size: 11.5px;
            color: #aaa;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .modal-close {
            background: #fff;
            color: #000;
            border: none;
            padding: 9px 22px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .modal-close:hover {
            opacity: 0.85;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 480px) {
            body {
                justify-content: flex-start;
                padding: 30px 12px;
            }

            .page-logo {
                width: 70px;
                height: 70px;
            }

            .card {
                padding: 24px 20px 20px 20px;
            }

            h1 {
                font-size: 20px;
            }

            .typewriter-box {
                font-size: 13px;
            }

            .shoutout-box {
                font-size: 14px;
            }

            .modal-box {
                padding: 24px 18px;
            }

            .modal-email-left {
                font-size: 13px;
            }
        }

        @keyframes rainbowFlash {
            0% { color: #ff3333; }
            14% { color: #ff9933; }
            28% { color: #ffff33; }
            42% { color: #33ff33; }
            57% { color: #33ffff; }
            71% { color: #3333ff; }
            85% { color: #9933ff; }
            100% { color: #ff3333; }
        }

        @keyframes caretBlink {
            0%, 100% { border-color: transparent; }
            50% { border-color: rgba(255, 255, 255, 0.6); }
        }
    </style>
</head>
<body>

    <!-- Logo Centered at the Top of the Page -->
    <div class="page-logo-container">
        <img src="nk.png" alt="nkwkr logo" class="page-logo">
    </div>

    <div class="card-wrapper">
        <div class="border-glow-mask"></div>
        <div class="card">
            <div class="card-header">
                <h1>End of an Era</h1>
                <div class="status-badge">
                    <span class="status-dot"></span>
                    Offline Permanently
                </div>
            </div>

            <div class="typewriter-box">
                <span id="typewriter" class="typewriter-text active-caret"></span>
            </div>

            <div class="shoutout-box">
                <span id="shoutout-typewriter" class="rainbow-shoutout"></span>
            </div>

            <div class="contact-section">
                <span>Want to get in touch?</span>
                <button class="contact-btn" id="openModalBtn">
                    <i class="fa-solid fa-envelope"></i> Contact Me
                </button>
            </div>
        </div>
    </div>

    <!-- Contact Modal Popup -->
    <div class="modal-overlay" id="contactModal">
        <div class="modal-box">
            <h3>Contact Me</h3>
            <p>I am only accepting messages from specific people—please make sure to clearly state who you are when messaging. Note that this email is not checked regularly and response times will vary.</p>
            
            <a href="mailto:n1ck@nigge.rs" class="modal-email-card">
                <div class="modal-email-left">
                    <i class="fa-solid fa-envelope"></i>
                    <span>n1ck@nigge.rs</span>
                </div>
                <span class="modal-email-action">Send Email</span>
            </a>

            <button class="modal-close" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        const mainText = "I have officially quit trickshotting, Black Ops 2, and the scene as a whole. It was a good run, but it's time to step away. I enjoyed every single minute of it, shoutout to everyone I met on the ports. I might come back one day, but for now I'm stepping away, as much fun as it has been. — nkwkr";
        const shoutoutText = "Huge shoutout to GeekleMatter, love you all. 🤍";

        let mainIndex = 0;
        let shoutoutIndex = 0;

        const mainEl = document.getElementById("typewriter");
        const shoutoutEl = document.getElementById("shoutout-typewriter");

        function getRandomTypingDelay(char) {
            let base = Math.floor(Math.random() * 20) + 20;
            if (char === '.' || char === ',' || char === '—') {
                return base + 100;
            }
            if (char === ' ') {
                return base + 6;
            }
            return base;
        }

        function typeMain() {
            if (mainIndex < mainText.length) {
                const currentChar = mainText.charAt(mainIndex);
                mainEl.textContent += currentChar;
                mainIndex++;
                setTimeout(typeMain, getRandomTypingDelay(currentChar));
            } else {
                mainEl.classList.remove("active-caret");
                shoutoutEl.classList.add("active-caret");
                setTimeout(typeShoutout, 180);
            }
        }

        function typeShoutout() {
            if (shoutoutIndex < shoutoutText.length) {
                const currentChar = shoutoutText.charAt(shoutoutIndex);
                shoutoutEl.textContent += currentChar;
                shoutoutIndex++;
                setTimeout(typeShoutout, getRandomTypingDelay(currentChar));
            } else {
                shoutoutEl.classList.remove("active-caret");
            }
        }

        window.onload = function() {
            setTimeout(typeMain, 400);
        };

        // Modal Logic
        const modal = document.getElementById('contactModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');

        openBtn.addEventListener('click', () => {
            modal.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
